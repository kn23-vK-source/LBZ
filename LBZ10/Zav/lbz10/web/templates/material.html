<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material List</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Material List</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Material Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            {% for material in materials %}
            <tr>
                <td>{{ material.id }}</td>
                <td>{{ material.material_name }}</td>
                <td>{{ material.price }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
