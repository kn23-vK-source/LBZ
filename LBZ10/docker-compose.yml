
services:
  ZAV2:
    image: zav
    build: 
      context: ./Zav
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8100"
      
  db:
    image: postgres:18.1-bookworm
    container_name: postgres_db
    environment:
      POSTGRES_USER: Triton
      POSTGRES_PASSWORD: satellite
      POSTGRES_DB: Io
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - ./postgres-data:/var/lib/postgresql
